    <script type="text/javascript">
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) {
      return cell !== '' && cell != null;
    }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) => {
            if (index + 1 >= filteredData.length) return false;
            return row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length;
          });
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error('Error processing XLSX:', e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>
  <script type="text/javascript">
    const BASE_URL = window.location.origin + '/api';
    const fetchWithRetry = async (url, options, type, setter, retries = 10, delay = 1000) => {
      console.log(`[FETCH] Starting ${type} from ${url}`);
      const companyId = localStorage.getItem('selectedCompanyId') || '1';
      const urlWithCompany = `${url}?company_id=${companyId}`;
      for (let i = 0; i < retries; i++) {
        try {
          console.log(`[FETCH] Attempt ${i + 1} for ${type}`);
          const response = await fetch(urlWithCompany, {
            ...options,
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', ...options?.headers },
            signal: AbortSignal.timeout(15000)
          });
          console.log(`[FETCH] Response for ${type}: status ${response.status}`);
          if (!response.ok) {
            const errorText = await response.text().catch(() => 'No response text');
            throw new Error(`HTTP ${response.status}: ${errorText || 'Unknown server error'}`);
          }
          const contentType = response.headers.get('content-type');
          if (!contentType?.includes('application/json')) {
            const text = await response.text().catch(() => 'No response text');
            throw new Error(`Expected JSON, got ${contentType || 'unknown'}: ${text.slice(0, 200)}`);
          }
          const data = await response.json();
          console.log(`[FETCH] Data for ${type}:`, JSON.stringify(data, null, 2));
          if (!data) {
            throw new Error(`Received empty response for ${type}`);
          }
          if (setter) {
            const validatedData = Array.isArray(data) ? data : [data];
            console.log(`[FETCH] Setting state for ${type}:`, validatedData.length, 'items');
            setter(validatedData);
          }
          return data;
        } catch (error) {
          console.error(`[FETCH] Error for ${type} (attempt ${i + 1}):`, error.message);
          if (i < retries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
            continue;
          }
          throw error;
        }
      }
    };
  </script>
  <script type="text/babel">
  const { useState, useEffect, useCallback, useMemo, Fragment } = React;
  const ErrorBoundary = ({ children }) => {
    const [error, setError] = useState(null);
    useEffect(() => {
      const errorHandler = (error) => {
        console.error('ErrorBoundary caught:', error);
        const errorMessage = error.message || (typeof error === 'string' ? error : 'An unexpected error occurred');
        setError(errorMessage);
      };
      window.addEventListener('error', errorHandler);
      return () => window.removeEventListener('error', errorHandler);
    }, []);
    if (error) {
      return (
        <div className="p-4 text-red-600 bg-red-100 rounded-lg shadow-sm">
          <h2>Error: {error}</h2>
          <p>Please refresh the page or check the console for details.</p>
        </div>
      );
    }
    return children;
  };

    const updateRunningTotal = useCallback((items, taxRate, discount = 0, shipping = 0) => {

        return sum + price * (item.quantity || 0);

        const sale = {
          customer_id: invoice.customer_id,
          items: invoice.items.map(item => ({
            product_id: item.product_id,
            quantity: item.quantity,
            custom_price: item.custom_price

          company_id: parseInt(selectedCompanyId || invoice.company_id || '1', 10),
          notes:
            `Paid invoice ${invoice.invoice_number || invoice.id}` +
            (payNote ? ` — ${payNote}` : '') +
            (invoice.notes ? ` — ${invoice.notes}` : ''),
          shipping_address: shipAddr,
          source: 'invoice'
        };
        const newSale = await fetchWithRetry(`${BASE_URL}/sales`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(sale)
        }, 'record sale', null);

        await fetchWithRetry(`${BASE_URL}/invoices/${invoice.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify({
            customer_id: invoice.customer_id,
            items: (invoice.items || []).map(item => ({
              product_id: item.product_id,
              quantity: item.quantity,
              custom_price: item.custom_price
            })),
            discount: invoice.discount || 0,
            tax_rate: invoice.tax_rate || 0,
            tax_label: invoice.tax_label || '',
            shipping: invoice.shipping || 0,
            payment_method: payForm.payment_method,
            date: invoice.date,
            subtotal: invoice.subtotal,
            tax: invoice.tax,
            total: invoice.total,
            company_id: parseInt(selectedCompanyId || invoice.company_id || '1', 10),
            notes: invoice.notes || '',
            status: 'Paid',
            shipping_address: shipAddr
          })

        setInvoices(prev =>
          prev.map(i =>
            i.id === invoice.id
              ? { ...i, status: 'Paid', payment_method: payForm.payment_method }
              : i
          )
        );
        setPayInvoice(null);
        setMessage({
          text: `Invoice ${invoice.invoice_number || 'N/A'} paid → sale ${newSale.transaction_number} (${payForm.payment_method})`,
          type: 'success'

      const websiteText = (_co && _co.website) || '';
      const websiteWidth = doc.getTextWidth(websiteText);
      doc.text(websiteText, (doc.internal.pageSize.width - websiteWidth) / 2, 36);
      doc.setFontSize(12);
      doc.text('Invoice', 20, 46);
      doc.text(`Invoice #${invoice.invoice_number || 'N/A'}`, 20, 54);
      doc.text(`PO #: ${invoice.customer_po || '—'}`, 110, 54);
      doc.text(`Date: ${invoice.date || 'N/A'}`, 20, 62);
      doc.text(`Status: ${invoice.status || 'Pending'}`, 20, 70);
      doc.text('To:', 20, 78);
      if (customer.shipping_address) {
        const shippingLines = customer.shipping_address.split('\n');
        let y = 86;
        shippingLines.forEach(line => {
          doc.text(line, 20, y);
          y += 8;
        });
        if (customer.billing_address !== customer.shipping_address) {
          doc.text('Bill To:', 20, y);
          y += 8;
          const billingLines = customer.billing_address ? customer.billing_address.split('\n') : ['N/A'];
          billingLines.forEach(line => {
            doc.text(line, 20, y);
            y += 8;
          });
        }
      } else {
        doc.text('N/A', 20, 86);
      }
      doc.autoTable({
        startY: doc.lastAutoTable?.finalY || 110,
        head: [['Item', 'SKU', 'Quantity', 'Price']],
        body: invoice.items && invoice.items.length > 0 ? invoice.items.map(item => {
          const product = products.find(p => p.id === item.product_id) || {};
          const price = item.custom_price || (product.retail_price || 0);
          return [
            product.name || 'Unknown',
            product.sku || 'N/A',
            item.quantity || 0,
            `$${price.toFixed(2)}${item.custom_price ? ' (Custom)' : ''}`
          ];
        }) : [['No items in this invoice', '', '', '']],
        styles: { fontSize: 10 },
        headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255] },
        margin: { top: 20 }
      });
      const finalY = doc.lastAutoTable.finalY || 110;
      doc.autoTable({
        startY: finalY + 10,
        head: [['Description', 'Amount']],
        body: [
          ['Subtotal', `$${(invoice.subtotal || 0).toFixed(2)}`],
          [(window.CompanyConfig && CompanyConfig.taxCaption) ? CompanyConfig.taxCaption(invoice) : 'Tax', `$${(invoice.tax || 0).toFixed(2)}`],
          ['Shipping', `$${(invoice.shipping || 0).toFixed(2)}`],

          ['Total', `$${(invoice.total || 0).toFixed(2)}`]
        ],
        styles: { fontSize: 10 },
        headStyles: { fillColor: [37, 99, 235], textColor: [255, 255, 255] },
        margin: { top: 20 }
      });
      const paymentY = doc.lastAutoTable.finalY + 10;

        startY: paymentY,
        body: [['Payment Method', invoice.payment_method || 'N/A']],
        styles: { fontSize: 10 },
        margin: { top: 20 }
      });
      let notesY = doc.lastAutoTable.finalY + 10;
      // My Company invoices: legal payee for checks
      if (String(selectedCompanyId) === '1') {
        doc.setFontSize(11);
        doc.setFont('helvetica', 'bold');
        doc.text('Make check payments out to ' + ((window.CompanyConfig && CompanyConfig.get() && (CompanyConfig.get().legal_name || CompanyConfig.get().name)) || 'My Company'), 20, notesY);
        notesY += 10;
        doc.setFont('helvetica', 'normal');
      }
      doc.setFontSize(10);
      doc.text('Comments:', 20, notesY);
      const notesLines = doc.splitTextToSize(invoice.notes || 'N/A', 170);
      doc.text(notesLines, 20, notesY + 8);
      doc.save(`Invoice_${invoice.invoice_number || 'invoice'}.pdf`);
    }, [customers, products, selectedCompanyId]);
    const handleImportInvoices = useCallback(async () => {
      if (!importFile) {
        setMessage({ text: 'Please select a file to import', type: 'error' });
        return;
      }
      console.log('[IMPORT] Starting invoices import');
      try {
        const reader = new FileReader();
        reader.onload = async (e) => {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames[0];
          const worksheet = workbook.Sheets[sheetName];
          const json = XLSX.utils.sheet_to_json(worksheet, { defval: '' });
          const invoicesToImport = json.map(row => {
            const items = companyUsesProducts() ? (row['Items'] || '').split(';').map(item => {
              const [sku, quantity, customPrice] = item.split(',').map(s => s.trim());
              const product = products.find(p => p.sku === sku);
              return {
                productId: product ? product.id : null,
                quantity: parseInt(quantity) || 1,
                customPrice: customPrice ? parseFloat(customPrice) : null
              };
            }).filter(item => item.productId) : [];
            const customer = customers.find(c => c.name.toLowerCase() === (row['Customer'] || '').toLowerCase());
            return {
              customer_id: customer ? customer.id : null,
              items,
              discount: parseFloat(row['Discount']) || 0,
              ...((window.CompanyConfig && CompanyConfig.parseImportTax)
                ? CompanyConfig.parseImportTax(row['Tax Rate'], selectedCompanyId)
                : { tax_rate: 0, tax_label: '' }),
              shipping: parseFloat(row['Shipping']) || 0,
              payment_method: row['Payment Method'] || 'Cash',
              date: row['Date'] || new Date().toISOString().split('T')[0],
              status: row['Status'] || 'Pending',
              company_id: parseInt(selectedCompanyId),
              notes: row['Notes'] || ''
            };
          }).filter(inv => inv.customer_id && (selectedCompanyId === '2' || inv.items.length > 0));
          if (invoicesToImport.length === 0) {
            setMessage({ text: 'No valid invoices found in the imported file', type: 'error' });
            return;
          }
          const importedInvoices = [];
          for (const inv of invoicesToImport) {
            const { subtotal, tax, total } = updateRunningTotal(inv.items, inv.tax_rate, inv.discount, inv.shipping);
            const invData = { ...inv, subtotal, tax, total };
            const response = await fetchWithRetry(`${BASE_URL}/invoices`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
              body: JSON.stringify(invData)
            }, 'import invoice', null);
            importedInvoices.push({
              ...response,
              customer_name: customers.find(c => c.id === inv.customer_id)?.name || 'Unknown'
            });
          }
          setInvoices(prev => {
            const updatedInvoices = [...prev, ...importedInvoices];
            console.log('[IMPORT] Imported:', importedInvoices.length, 'invoices');
            return updatedInvoices;
          });
          setImportFile(null);
          document.getElementById('importFile').value = '';
          setMessage({ text: `${importedInvoices.length} invoice(s) imported successfully`, type: 'success' });
        };
        reader.readAsArrayBuffer(importFile);
      } catch (err) {
        console.error('[IMPORT] Error:', err);
        setMessage({ text: `Error importing invoices: ${err.message}`, type: 'error' });
      }
    }, [importFile, products, customers, updateRunningTotal, selectedCompanyId]);

                              <p><strong>Subtotal:</strong> ${(invoice.subtotal || 0).toFixed(2)}</p>
                              <p><strong>{(window.CompanyConfig && CompanyConfig.taxCaption) ? CompanyConfig.taxCaption(invoice) : 'Tax'}:</strong> ${(invoice.tax || 0).toFixed(2)}</p>
                              <p><strong>Shipping:</strong> ${(invoice.shipping || 0).toFixed(2)}</p>
                              {invoice.discount > 0 && <p><strong>Discount:</strong> -${(invoice.discount || 0).toFixed(2)}</p>}
                              <p><strong>Total:</strong> ${(invoice.total || 0).toFixed(2)}</p>
                              <p><strong>Payment Method:</strong> {invoice.payment_method || 'N/A'}</p>
                              {String(selectedCompanyId) === '1' && (
                                <p className="font-bold text-gray-900 mt-1">Make check payments out to the company on this invoice</p>
                              )}
                              <p><strong>Comments:</strong> {invoice.notes || 'N/A'}</p>
                              <p><strong>Billing Address:</strong> {(customers.find(c => c.id === invoice.customer_id)?.billing_address || 'N/A')}</p>
                              <p><strong>Shipping Address:</strong> {(typeof resolveShipTo === 'function'
                                ? resolveShipTo({ override: invoice.shipping_address, customer: customers.find(c => c.id === invoice.customer_id) })
                                : (invoice.shipping_address || customers.find(c => c.id === invoice.customer_id)?.shipping_address || customers.find(c => c.id === invoice.customer_id)?.billing_address || 'N/A')) || 'N/A'}</p>
                            </div>
                          </td>
                        </tr>
                      )}
                    </Fragment>
                  ))}
                </tbody>
              </table>
            </div>
          ) : (
            <div className="p-4 bg-white rounded-lg shadow-md">
              <div className="p-8 bg-white rounded-lg shadow-md text-center border border-gray-200">
                <p className="text-lg font-semibold text-gray-800 mb-1">No invoices yet</p>
                <p className="text-sm text-gray-500 mb-4">
                  Create an invoice with the form above, or convert an approved estimate.
                </p>
                <div className="flex flex-wrap gap-2 justify-center">
                  <a href="#customerSearch" className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 inline-block no-underline">
                    New invoice
                  </a>
                  <a href="/estimates.html" className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700 inline-block no-underline">
                    Estimates
                  </a>
                  <a href="/sales.html" className="bg-gray-200 text-gray-800 px-4 py-2 rounded-md hover:bg-gray-300 inline-block no-underline">
                    Sales
                  </a>
                </div>
              </div>
            </div>
          )}
          {payInvoice && (
            <div className="modal" onClick={() => !payBusy && setPayInvoice(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()} style={{ maxWidth: '28rem' }}>
                <h3 className="text-lg font-semibold mb-2">Pay Invoice</h3>
                <p className="text-sm text-gray-600 mb-4">
                  <strong>{payInvoice.invoice_number || 'Invoice'}</strong>
                  {' · '}{payInvoice.customer_name || 'Customer'}
                  {' · '}<strong>${Number(payInvoice.total || 0).toFixed(2)}</strong>
                </p>
                <p className="text-xs text-gray-500 mb-4">
                  Records a sale (inventory + books) and marks this invoice <strong>Paid</strong> so it drops out of open invoices.
                </p>
                <label className="block text-sm font-medium text-gray-700">Payment method</label>
                <select
                  value={payForm.payment_method}
                  onChange={e => setPayForm(f => ({ ...f, payment_method: e.target.value }))}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                  disabled={payBusy}
                >
                  <option value="Cash">Cash</option>
                  <option value="Card">Card</option>
                  <option value="Check">Check</option>
                  <option value="Square">Square</option>
                  <option value="PayPal">PayPal</option>
                  <option value="Amazon">Amazon</option>
                  <option value="eBay">eBay</option>
                  <option value="Zelle">Zelle</option>
                  <option value="Wire">Wire</option>
                  <option value="ACH">ACH</option>
                </select>
                <label className="block text-sm font-medium text-gray-700 mt-4">Payment date</label>
                <input
                  type="date"
                  value={payForm.payment_date}
                  onChange={e => setPayForm(f => ({ ...f, payment_date: e.target.value }))}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                  disabled={payBusy}
                  required
                />
                <label className="block text-sm font-medium text-gray-700 mt-4">Note (optional)</label>
                <input
                  type="text"
                  value={payForm.note}
                  onChange={e => setPayForm(f => ({ ...f, note: e.target.value }))}
                  placeholder="Check #, last 4 of card, etc."
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm"
                  disabled={payBusy}
                />
                <div className="flex justify-end gap-2 mt-6">
                  <button
                    type="button"
                    className="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600"
                    onClick={() => setPayInvoice(null)}
                    disabled={payBusy}
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    className="btn-convert"
                    onClick={handlePayInvoice}
                    disabled={payBusy}
                  >
                    {payBusy ? 'Recording…' : 'Pay & Create Sale'}
                  </button>
                </div>
              </div>
            </div>
          )}
          {showCustomerModal && (
            <div className="modal">
              <div className="modal-content">
                <h3 className="text-lg font-semibold mb-4">Add New Customer</h3>
                <form onSubmit={handleAddCustomer}>
                  <label htmlFor="customerName" className="block text-sm font-medium text-gray-700">Name</label>
                  <input
                    type="text"
                    id="customerName"
                    name="name"
                    value={newCustomer.name}
                    onChange={handleCustomerFormChange}
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    required
                  />
                  <label htmlFor="email" className="block text-sm font-medium text-gray-700 mt-4">Email (Optional)</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    value={newCustomer.email}
                    onChange={handleCustomerFormChange}
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="phone" className="block text-sm font-medium text-gray-700 mt-4">Phone (Optional)</label>
                  <input
                    type="tel"
                    id="phone"
                    name="phone"
                    value={newCustomer.phone}
                    onChange={handleCustomerFormChange}
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="billing_address" className="block text-sm font-medium text-gray-700 mt-4">Billing Address</label>
                  <textarea
                    id="billing_address"
                    name="billing_address"
                    value={newCustomer.billing_address}
                    onChange={handleCustomerFormChange}
                    rows="4"
                    placeholder="Paste address here; first line sets Name, address copies to Shipping by default"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    required
                  />
                  <label htmlFor="shipping_address" className="block text-sm font-medium text-gray-700 mt-4">Shipping Address (Optional)</label>
                  <textarea
                    id="shipping_address"
                    name="shipping_address"
                    value={newCustomer.shipping_address}
                    onChange={handleCustomerFormChange}
                    rows="4"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <div className="mt-4 flex justify-end gap-4">
                    <button
                      type="button"
                      onClick={() => {
                        setShowCustomerModal(false);
                        setNewCustomer({ name: '', email: '', phone: '', billing_address: '', shipping_address: '' });
                      }}
                      className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700"
                    >
                      Cancel
                    </button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                      Add Customer
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
          {editForm && (
            <div className="modal">
              <div className="modal-content">
                <h3 className="text-lg font-semibold mb-4">Edit Invoice</h3>
                <form onSubmit={handleEditSubmit}>
                  <label htmlFor="editCustomerId" className="block text-sm font-medium text-gray-700">Customer</label>
                  <select
                    id="editCustomerId"
                    name="customerId"
                    value={editForm.customerId}
                    onChange={handleEditFormChange}
                    required
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  >
                    <option value="">Select a customer</option>
                    {customers.map(customer => (
                      <option key={customer.id} value={customer.id}>{customer.name}</option>
                    ))}
                  </select>
                  {companyUsesProducts() && (
                    <>
                      <label htmlFor="editSkuSearch" className="block text-sm font-medium text-gray-700 mt-4">Add Product (Search by SKU or Name)</label>
                      <div className="relative mt-1 flex items-center flex-wrap">
                        <input
                          type="text"
                          id="editSkuSearch"
                          value={skuSearch}
                          onChange={handleSkuSearchChange}
                          placeholder="Enter SKU or product name"
                          className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:w-[calc(100%-7.5rem)]"
                        />
                        <input
                          type="number"
                          id="editCurrentQuantity"
                          value={currentQuantity}
                          onChange={(e) => setCurrentQuantity(e.target.value)}
                          min="1"
                          placeholder="Qty"
                          className="mt-1 ml-2 w-20 border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                        />
                        <button
                          type="button"
                          onClick={handleEditAddItem}
                          disabled={!currentProductId || !currentQuantity}
                          className="mt-1 ml-2 bg-blue-600 text-white px-2 py-1 rounded hover:bg-blue-700 disabled:bg-gray-300"
                        >
                          Add
                        </button>
                        {skuSearch && filteredProducts.length > 0 && !currentProductId && (
                          <div className="absolute z-10 w-full bg-white border border-gray-300 rounded-md shadow-sm max-h-48 overflow-y-auto top-full">
                            {filteredProducts.map(product => (
                              <div
                                key={product.id}
                                onClick={() => handleProductSelect(product)}
                                className="px-4 py-2 hover:bg-gray-100 cursor-pointer"
                              >
                                {`${product.name} (SKU: ${product.sku})`}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                      <label htmlFor="editCurrentCustomPrice" className="block text-sm font-medium text-gray-700 mt-4">Custom Price (Optional)</label>
                      <input
                        type="number"
                        id="editCurrentCustomPrice"
                        value={currentCustomPrice}
                        onChange={(e) => setCurrentCustomPrice(e.target.value)}
                        min="0"
                        step="0.01"
                        placeholder={currentProductId ? `Default: $${products.find(p => p.id === parseInt(currentProductId))?.retail_price?.toFixed(2) || '0.00'}` : 'Enter custom price'}
                        className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                      />
                    </>
                  )}
                  {editForm.items.length > 0 && (
                    <div className="mt-4">
                      <h4 className="text-lg font-semibold">Selected Items</h4>
                      {editForm.items.map((item, index) => {
                        const product = products.find(p => p.id === item.productId) || {};
                        const price = item.customPrice || (product.retail_price || 0);
                        return (
                          <div key={index} className="border border-gray-200 p-2 mb-2 rounded flex justify-between items-center">
                            <div>
                              <p><strong>Item Name:</strong> {product.name || 'Unknown'}</p>
                              <p><strong>SKU:</strong> {product.sku || 'N/A'}</p>
                              <p><strong>Quantity:</strong> {item.quantity || 0}</p>
                              <p><strong>Price:</strong> ${price.toFixed(2)}{item.customPrice ? ' (Custom)' : ''}</p>
                            </div>
                            <button
                              type="button"
                              onClick={() => handleEditRemoveItem(index)}
                              className="bg-red-600 text-white px-2 py-1 rounded hover:bg-red-700"
                            >
                              Remove
                            </button>
                          </div>
                        );
                      })}
                    </div>
                  )}
                  <label htmlFor="editDiscount" className="block text-sm font-medium text-gray-700 mt-4">Discount (Optional)</label>
                  <input
                    type="number"
                    id="editDiscount"
                    name="discount"
                    value={editForm.discount}
                    onChange={handleEditFormChange}
                    min="0"
                    step="0.01"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="editTaxRate" className="block text-sm font-medium text-gray-700 mt-4">Sales Tax</label>
                  <select
                    id="editTaxRate"
                    value={editForm.taxCustom ? '__custom__' : String(editForm.taxIndex != null ? editForm.taxIndex : 0)}
                    onChange={(e) => setEditForm(prev => (window.CompanyConfig ? CompanyConfig.pickTax(prev, companyTaxRates(), e.target.value) : prev))}
                    required
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  >
                    {companyTaxRates().map((tr, i) => (
                      <option key={i} value={String(i)}>{tr.label}</option>
                    ))}
                    <option value="__custom__">Custom percent</option>
                  </select>
                  {editForm.taxCustom && (
                    <input
                      type="number"
                      min="0"
                      max="100"
                      step="0.001"
                      aria-label="Custom tax percent"
                      placeholder="Percent from 0 to 100"
                      value={editForm.customPercent}
                      onChange={(e) => setEditForm(prev => (window.CompanyConfig ? CompanyConfig.setCustomPercent(prev, e.target.value) : prev))}
                      className="mt-2 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    />
                  )}
                  <label htmlFor="editShipping" className="block text-sm font-medium text-gray-700 mt-4">Shipping Charge</label>
                  <input
                    type="number"
                    id="editShipping"
                    name="shipping"
                    value={editForm.shipping}
                    onChange={handleEditFormChange}
                    min="0"
                    step="0.01"
                    placeholder="Enter shipping charge"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="editPaymentMethod" className="block text-sm font-medium text-gray-700 mt-4">Payment Method</label>
                  <select
                    id="editPaymentMethod"
                    name="paymentMethod"
                    value={editForm.paymentMethod}
                    onChange={handleEditFormChange}
                    required
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  >
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="PayPal">PayPal</option>
                    <option value="Amazon">Amazon</option>
                    <option value="eBay">eBay</option>
                    <option value="Check">Check</option>
                    <option value="Square">Square</option>
                  </select>
                  <label htmlFor="editStatus" className="block text-sm font-medium text-gray-700 mt-4">Status</label>
                  <select
                    id="editStatus"
                    name="status"
                    value={editForm.status}
                    onChange={handleEditFormChange}
                    required
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  >
                    <option value="Pending">Pending</option>
                    <option value="Approved">Approved</option>
                  </select>
                  <label htmlFor="editDate" className="block text-sm font-medium text-gray-700 mt-4">Date</label>
                  <input
                    type="date"
                    id="editDate"
                    name="date"
                    value={editForm.date}
                    onChange={handleEditFormChange}
                    required
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="editCustomerPo" className="block text-sm font-medium text-gray-700 mt-4">Customer PO #</label>
                  <input
                    type="text"
                    id="editCustomerPo"
                    name="customer_po"
                    value={editForm.customer_po || ''}
                    onChange={handleEditFormChange}
                    placeholder="Client purchase order (printed on PDF)"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <label htmlFor="editNotes" className="block text-sm font-medium text-gray-700 mt-4">Comments</label>
                  <textarea
                    id="editNotes"
                    name="notes"
                    value={editForm.notes}
                    onChange={handleEditFormChange}
                    rows="4"
                    className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  />
                  <div className="mt-4">
                    <h4 className="text-lg font-semibold">Invoice Summary</h4>
                    <p>Subtotal: ${(updateRunningTotal(editForm.items, editForm.taxRate, editForm.discount, editForm.shipping).subtotal || 0).toFixed(2)}</p>
                    <p>Tax: ${(updateRunningTotal(editForm.items, editForm.taxRate, editForm.discount, editForm.shipping).tax || 0).toFixed(2)}</p>
                    <p>Shipping: ${(editForm.shipping || 0).toFixed(2)}</p>
                    {editForm.discount > 0 && <p>Discount: -${editForm.discount.toFixed(2)}</p>}
                    <p><strong>Total: ${(updateRunningTotal(editForm.items, editForm.taxRate, editForm.discount, editForm.shipping).total || 0).toFixed(2)}</strong></p>
                  </div>
                  <div className="mt-4 flex justify-end gap-4">
                    <button
                      type="button"
                      onClick={() => setEditForm(null)}
                      className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700"
                    >
                      Cancel
                    </button>
                    <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                      Update Invoice
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </main>
      </ErrorBoundary>
    );
  };
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<InvoicesPage />);
</script>
<script>

    linkColorPicker.addEventListener('change', (e) => {
      const newColor = e.target.value;
      navLinks.forEach(link => link.style.color = newColor);
      localStorage.setItem(linkKey, newColor);
    });
  });
</script>
</body>
</html>
