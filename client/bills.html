<script type="text/javascript">
  var gk_isXlsx = false;
  var gk_xlsxFileLookup = {};
  var gk_fileData = {};
  function filledCell(cell) {
    return cell !== '' && cell != null;
  }
  function loadFileData(filename) {
    if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
      try {
        var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
        var firstSheetName = workbook.SheetNames[0];
        var worksheet = workbook.Sheets[firstSheetName];
        var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
        var filteredData = jsonData.filter(row => row.some(filledCell));
        var headerRowIndex = filteredData.findIndex((row, index) => {
          if (index + 1 >= filteredData.length) return false;
          return row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length;
        });
        if (headerRowIndex === -1 || headerRowIndex > 25) {
          headerRowIndex = 0;
        }
        var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
        csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
        return csv;
      } catch (e) {
        console.error('Error processing XLSX:', e);
        return "";
      }
    }
    return gk_fileData[filename] || "";
  }

  // Match other pages: support code-server proxy and direct HTTPS :3003
  const BASE_URL = (document.querySelector('base')?.getAttribute('href') || '').includes('proxy/3003')
    ? '/api'
    : '/api';
  const fetchWithRetry = async (url, options, type, setter, retries = 3, delay = 1000) => {
    console.log(`[FETCH] Starting ${type} from ${url}`);
    const companyId = localStorage.getItem('selectedCompanyId') || '1';
    const sep = url.includes('?') ? '&' : '?';
    const urlWithCompany = `${url}${sep}company_id=${companyId}`;
    for (let i = 0; i < retries; i++) {
      try {
        console.log(`[FETCH] Attempt ${i + 1} for ${type} at ${new Date().toISOString()}`);
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 15000);
        const response = await fetch(urlWithCompany, {
          ...options,
          headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', ...options?.headers },
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        console.log(`[FETCH] Response for ${type}: status ${response.status}, headers:`, response.headers);
        if (!response.ok) {
          let errorText = 'No response text';
          try {
            errorText = await response.text() || 'Empty response';
          } catch (textErr) {
            console.warn(`[FETCH] Failed to read response text:`, textErr);
          }
          const error = new Error(`HTTP ${response.status}: ${errorText}`);
          error.status = response.status;
          if (response.status === 404) {
            console.log(`[FETCH] 404 detected, skipping retries:`, error.message);
            throw error;
          }
          throw error;
        }
        if (response.status === 204) {
          console.log(`[FETCH] 204 No Content for ${type}, returning null`);
          return null;
        }
        const contentType = response.headers.get('content-type');
        if (contentType && !contentType.includes('application/json')) {
          const text = await response.text().catch(() => 'No response text');
          console.error(`[FETCH] Non-JSON response for ${type}: ${text.slice(0, 200)}`);
          throw new Error(`Expected JSON, got ${contentType || 'unknown'}: ${text.slice(0, 200)}`);
        }
        const text = await response.text();
        console.log(`[FETCH] Raw response for ${type}: ${text.slice(0, 200)}`);
        const data = JSON.parse(text);
        console.log(`[FETCH] Data for ${type}:`, JSON.stringify(data, null, 2));
        if (!data && type !== 'delete') {
          throw new Error(`Received empty response for ${type}`);
        }
        if (setter) {
          const validatedData = Array.isArray(data) ? data : [data];
          console.log(`[FETCH] Setting state for ${type}:`, validatedData.length, ' items');
          setter(validatedData);
        }
        return data;
      } catch (error) {
        console.error(`[FETCH] Error for ${type} (attempt ${i + 1}):`, error.message, 'Status:', error.status, 'Error:', JSON.stringify(error));
        if (error.status === 404 || error.message.includes('HTTP 404')) {
          console.log(`[FETCH] 414 error caught, throwing immediately:`, error.message);
          throw error;
        }
        if (i < retries - 1) {
          await new Promise(resolve => setTimeout(resolve, delay));
          continue;
        }
        throw error;
      }
    }
  };

  const { useState, useEffect } = React;
  const ErrorBoundary = ({ children }) => {
    const [error, setError] = useState(null);
    useEffect(() => {
      const errorHandler = (errorEvent) => {
        console.error('ErrorBoundary caught:', errorEvent.error);
        setError(errorEvent.error.message || 'An unexpected error occurred');
      };
      window.addEventListener('error', errorHandler);
      return () => window.removeEventListener('error', errorHandler);
    }, []);
    if (error) {
      return (
        React.createElement('div', { className: 'p-4 text-red-600 bg-red-100 rounded-lg shadow-sm m-6' },
          React.createElement('h2', { className: 'text-lg font-bold' }, `Error: ${error}`),
          React.createElement('p', null, 'Please try refreshing the page or click below to retry.'),
          React.createElement('button', {
            className: 'mt-2 bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700',
            onClick: () => { setError(null); window.location.reload(); }
          }, 'Retry')
        )
      );
    }
    return children;
  };

  const BillRow = ({ bill, vendors, purchaseOrders, expenseCategories, selectedBills, editingBillId, editingBillData, setEditingBillId, setEditingBillData, handleSelectBill, updateBill, payBill, deleteBill, getVendorName, getPurchaseOrderNumber, getExpenseCategoryName }) => {
    return editingBillId === bill.id ? (
      React.createElement('tr', { key: `${bill.id}-edit` },
        React.createElement('td', { colSpan: 11, className: 'px-2 py-2' },
          React.createElement('div', { className: 'bg-gray-50 p-4 rounded-lg' },
            React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-2 gap-4' },
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-billNumber-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Bill Number (Optional)'),
                React.createElement('input', {
                  id: `edit-billNumber-${bill.id}`,
                  type: 'text',
                  value: editingBillData.billNumber,
                  onChange: e => setEditingBillData({ ...editingBillData, billNumber: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  placeholder: 'e.g., BILL-001'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-invoiceNumber-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Invoice Number (Optional)'),
                React.createElement('input', {
                  id: `edit-invoiceNumber-${bill.id}`,
                  type: 'text',
                  value: editingBillData.invoiceNumber,
                  onChange: e => setEditingBillData({ ...editingBillData, invoiceNumber: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  placeholder: 'e.g., INV-001'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-vendorId-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Vendor'),
                React.createElement('select', {
                  id: `edit-vendorId-${bill.id}`,
                  value: editingBillData.vendorId,
                  onChange: e => setEditingBillData({ ...editingBillData, vendorId: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  required: true
                },
                  React.createElement('option', { value: '' }, 'Select Vendor'),
                  vendors.map(vendor => React.createElement('option', { key: vendor.id, value: vendor.id }, vendor.name))
                )
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-purchaseOrderId-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Purchase Order (Optional)'),
                React.createElement('select', {
                  id: `edit-purchaseOrderId-${bill.id}`,
                  value: editingBillData.purchaseOrderId,
                  onChange: e => setEditingBillData({ ...editingBillData, purchaseOrderId: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500'
                },
                  React.createElement('option', { value: '' }, 'No Purchase Order'),
                  purchaseOrders.map(po => React.createElement('option', { key: po.id, value: po.id }, po.po_number))
                )
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-expenseCategoryId-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Expense Category (Optional)'),
                React.createElement('select', {
                  id: `edit-expenseCategoryId-${bill.id}`,
                  value: editingBillData.expenseCategoryId,
                  onChange: e => setEditingBillData({ ...editingBillData, expenseCategoryId: e.target.value, isInventoryBill: e.target.value === '' }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500'
                },
                  React.createElement('option', { value: '' }, 'Inventory'),
                  expenseCategories.map(category => React.createElement('option', { key: category.id, value: category.id }, category.name))
                )
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-amount-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Amount'),
                React.createElement('input', {
                  id: `edit-amount-${bill.id}`,
                  type: 'number',
                  value: editingBillData.amount,
                  onChange: e => setEditingBillData({ ...editingBillData, amount: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  step: '0.01',
                  min: '0',
                  required: true,
                  placeholder: 'e.g., 100.00'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-billDate-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Bill Date'),
                React.createElement('input', {
                  id: `edit-billDate-${bill.id}`,
                  type: 'date',
                  value: editingBillData.billDate,
                  onChange: e => setEditingBillData({ ...editingBillData, billDate: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  required: true
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-dueDate-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Due Date (Optional)'),
                React.createElement('input', {
                  id: `edit-dueDate-${bill.id}`,
                  type: 'date',
                  value: editingBillData.dueDate,
                  onChange: e => setEditingBillData({ ...editingBillData, dueDate: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500'
                })
              ),
              React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-paid-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Paid'),
                React.createElement('input', {
                  id: `edit-paid-${bill.id}`,
                  type: 'checkbox',
                  checked: editingBillData.paid,
                  onChange: e => setEditingBillData({
                    ...editingBillData,
                    paid: e.target.checked,
                    payment_date: e.target.checked ? (editingBillData.payment_date || new Date().toISOString().split('T')[0]) : ''
                  }),
                  className: 'mt-1 h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500'
                })
              ),
              editingBillData.paid && React.createElement('div', null,
                React.createElement('label', { htmlFor: `edit-paymentDate-${bill.id}`, className: 'block text-sm font-medium text-gray-700' }, 'Payment Date'),
                React.createElement('input', {
                  id: `edit-paymentDate-${bill.id}`,
                  type: 'date',
                  value: editingBillData.payment_date,
                  onChange: e => setEditingBillData({ ...editingBillData, payment_date: e.target.value }),
                  className: 'mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500',
                  required: true
                })
              )
            ),
            React.createElement('div', { className: 'mt-4 flex space-x-2' },
              React.createElement('button', {
                onClick: () => updateBill(bill.id, editingBillData),
                className: 'bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700'
              }, 'Save'),
              React.createElement('button', {
                onClick: () => {
                  setEditingBillId(null);
                  setEditingBillData(null);
                },
                className: 'bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700'
              }, 'Cancel')
            )
          )
        )
      )
    ) : (
      React.createElement('tr', { key: bill.id, className: 'hover:bg-gray-100' },
        React.createElement('td', { className: 'px-2 py-2' },
          React.createElement('input', {
            type: 'checkbox',
            checked: selectedBills.includes(bill.id),
            onChange: () => handleSelectBill(bill.id),
            disabled: bill.paid || bill.payment_date,
            className: 'h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500'
          })
        ),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, bill.bill_number || 'N/A'),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, bill.invoice_number || 'N/A'),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, getVendorName(bill.vendor_id)),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, getPurchaseOrderNumber(bill.purchase_order_id)),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, getExpenseCategoryName(bill)),
        React.createElement('td', { className: 'px-2 py-2' }, `$${bill.amount.toFixed(2)}`),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, bill.bill_date),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' }, bill.due_date || 'N/A'),
        React.createElement('td', { className: 'px-2 py-2' },
          React.createElement('span', { className: bill.paid || bill.payment_date ? 'text-green-600' : 'text-red-600' },
            bill.paid || bill.payment_date ? 'Yes' : 'No'
          )
        ),
        React.createElement('td', { className: 'px-2 py-2 whitespace-nowrap' },
          React.createElement('button', {
            onClick: () => {
              setEditingBillId(bill.id);
              setEditingBillData({
                vendorId: bill.vendor_id ? String(bill.vendor_id) : '',
                purchaseOrderId: bill.purchase_order_id ? String(bill.purchase_order_id) : '',
                expenseCategoryId: bill.expense_category_id ? String(bill.expense_category_id) : '',

  const BillsPage = () => {
    const [bills, setBills] = useState([]);
    const [vendors, setVendors] = useState([]);

    const [expenseCategories, setExpenseCategories] = useState([]);

    const [sortConfig, setSortConfig] = useState({ key: 'dueDate', direction: 'desc' });
    const [editingBillId, setEditingBillId] = useState(null);
    const [editingBillData, setEditingBillData] = useState(null);
    const [newBill, setNewBill] = useState({
      vendorId: '',
      purchaseOrderId: '',

      amount: '',
      billDate: new Date().toISOString().split('T')[0],

      paid: false,
      billNumber: '',
      invoiceNumber: '',

      payment_date: '',

    });
    const [selectedBills, setSelectedBills] = useState([]);
    const [error, setError] = useState(null);
    const [success, setSuccess] = useState(null);
    const [isLoading, setIsLoading] = useState(true);
    const [currentMonth, setCurrentMonth] = useState(null);
    const [collapsedMonths, setCollapsedMonths] = useState([]);

    const handleSort = (key) => {
      setSortConfig(prev => ({
        key,
        direction: prev.key === key && prev.direction === 'asc' ? 'desc' : 'asc'
      }));
    };

    const sortBills = (bills, key, direction) => {
      const sorted = [...bills];
      const isAsc = direction === 'asc' ? 1 : -1;
      sorted.sort((a, b) => {
        if (key === 'vendorName') {
          return getVendorName(a.vendor_id).toLowerCase().localeCompare(getVendorName(b.vendor_id).toLowerCase()) * isAsc;
        }
        if (key === 'poNumber') {
          return getPurchaseOrderNumber(a.purchase_order_id).toLowerCase().localeCompare(getPurchaseOrderNumber(b.purchase_order_id).toLowerCase()) * isAsc;
        }
        if (key === 'expenseCategory') {
          return getExpenseCategoryName(a).toLowerCase().localeCompare(getExpenseCategoryName(b).toLowerCase()) * isAsc;
        }
        if (key === 'billNumber') {
          const aValue = (a.bill_number || 'N/A').toLowerCase();
          const bValue = (b.bill_number || 'N/A').toLowerCase();
          return aValue.localeCompare(bValue) * isAsc;
        }
        if (key === 'invoiceNumber') {
          const aValue = (a.invoice_number || 'N/A').toLowerCase();
          const bValue = (b.invoice_number || 'N/A').toLowerCase();
          return aValue.localeCompare(bValue) * isAsc;
        }
        if (key === 'billDate') {
          return (new Date(a.bill_date || '1970-01-01') - new Date(b.bill_date || '1970-01-01')) * isAsc;
        }
        if (key === 'dueDate') {
          return (new Date(a.due_date || '9999-12-31') - new Date(b.due_date || '9999-12-31')) * isAsc;
        }
        if (key === 'paid') {
          return ((a.paid || a.payment_date ? 1 : 0) - (b.paid || b.payment_date ? 1 : 0)) * isAsc;
        }
        const aValue = a[key] != null ? a[key] : 0;
        const bValue = b[key] != null ? b[key] : 0;
        return (aValue - bValue) * isAsc;
      });
      return sorted;
    };

    useEffect(() => {
      const fetchData = async () => {
        setIsLoading(true);
        try {
          await Promise.all([
            fetchWithRetry(`${BASE_URL}/bills`, { headers: { 'Accept': 'application/json' } }, 'bills', setBills),

            fetchWithRetry(`${BASE_URL}/purchase-order`, { headers: { 'Accept': 'application/json' } }, 'purchase orders', setPurchaseOrders),
            fetchWithRetry(`${BASE_URL}/expense_categories`, { headers: { 'Accept': 'application/json' } }, 'expense categories', setExpenseCategories)
          ]);

          console.log('[BILLS_PAGE] Fetched expenseCategories:', expenseCategories);
          console.log('[BILLS_PAGE] Fetched bills:', bills);

          setError(`Failed to load data: ${err.message}`);

      fetchData();
      const handleCompanyChange = () => {

        setSortConfig({ key: 'dueDate', direction: 'desc' });

          expenseCategoryId: '',

    }, []);

    useEffect(() => {
      if (bills.length > 0 && !currentMonth) {

        const latestBillDate = validBills.length > 0

    const getExpenseCategoryName = (bill) => {

    const addExpenseCategory = async () => {

    const generatePaidBillsPDF = (paidBills, checkNumber) => {
      const vendorId = paidBills[0].vendor_id;
      const vendorName = getVendorName(vendorId);
      const totalAmount = paidBills.reduce((sum, b) => sum + (b.amount || 0), 0).toFixed(2);

    const getMonthKey = (billDate) => {
      if (!billDate || isNaN(Date.parse(billDate))) {
        console.warn(`[PAGINATION] Invalid bill_date: ${billDate}, skipping bill`);
        return null;
      }
      const [year, month] = billDate.split('-').map(Number);
      const date = new Date(year, month - 1, 1);
      const monthKey = `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`;
      if (monthKey === '2025-03') {
        console.log(`[PAGINATION] Bill assigned to March 2025: bill_date=${billDate}`);
      }
      return monthKey;
    };

    const groupBillsByMonth = (bills) => {
      const months = {};
      bills.forEach(bill => {
        const monthKey = getMonthKey(bill.bill_date);
        if (monthKey) {
          if (!months[monthKey]) {
            months[monthKey] = [];
          }
          months[monthKey].push(bill);
        }
      });
      const monthGroups = Object.keys(months)
        .map(month => ({
          month,
          bills: months[month],
          date: new Date(`${month}-01`)
        }))
        .sort((a, b) => b.date - a.date)
        .map(({ month, bills }) => ({ month, bills }));
      console.log('[PAGINATION] Month groups:', monthGroups.map(g => ({ month: g.month, count: g.bills.length })));
      return monthGroups;
    };

    const handleMonthNavigation = (direction) => {
      const months = groupBillsByMonth(bills).map(m => m.month);
      const currentIndex = months.indexOf(currentMonth);
      console.log(`[PAGINATION] Navigating ${direction}, currentMonth: ${currentMonth}, currentIndex: ${currentIndex}, months:`, months);
      if (direction === 'next' && currentIndex < months.length - 1) {
        const nextMonth = months[currentIndex + 1];
        setCurrentMonth(nextMonth);
        setCollapsedMonths(prev => [...new Set([...prev, ...months.slice(0, currentIndex + 1).filter(m => m !== nextMonth)])]);
      } else if (direction === 'prev' && currentIndex > 0) {
        const prevMonth = months[currentIndex - 1];
        setCurrentMonth(prevMonth);
        setCollapsedMonths(prev => prev.filter(m => m !== prevMonth));
      } else {
        console.warn(`[PAGINATION] Invalid navigation: ${direction}, currentIndex: ${currentIndex}`);
      }
    };

    const toggleMonth = (month) => {
      setCollapsedMonths(prev => {
        const newCollapsed = prev.includes(month) ? prev.filter(m => m !== month) : [...prev, month];
        console.log(`[PAGINATION] Toggled month ${month}, collapsedMonths:`, newCollapsed);
        return newCollapsed;
      });
    };

    const addBill = async (billData) => {

        return { success: false, isInvalid: true };

      const amount = parseFloat(billData.amount);

        setError('Amount must be a positive number');
        return { success: false, isInvalid: true };

      if (billData.paid && !billData.payment_date) {
        setError('Payment date is required when marking a bill as paid');
        return { success: false, isInvalid: true };
      }
      try {
        const companyId = localStorage.getItem('selectedCompanyId') || '1';
        const payload = {
          vendor_id: parseInt(billData.vendorId),
          purchase_order_id: billData.purchaseOrderId ? parseInt(billData.purchaseOrderId) : null,
          bill_number: billData.billNumber || null,
          invoice_number: billData.invoiceNumber || null,
          amount: amount,
          bill_date: billData.billDate,
          due_date: billData.dueDate || null,
          is_inventory_bill: billData.isInventoryBill || false,
          expense_category_id: billData.expenseCategoryId ? parseInt(billData.expenseCategoryId) : null,
          paid: !!billData.paid,
          payment_date: billData.paid ? billData.payment_date : null,
          company_id: parseInt(companyId)
        };

          method: 'POST',
          body: JSON.stringify(payload)

        return { success: true, isInvalid: false };

        console.error(`[ADD_BILL] Error creating bill:`, err.message, err);
        setError(`Failed to add bill: ${err.message.includes('SQLITE_ERROR') ? 'Database error - please contact support' : err.message}`);

    const updateBill = async (billId, billData) => {

        setError('Vendor, amount, and bill date are required');
        return null;

      const amount = parseFloat(billData.amount);

        setError('Amount must be a positive number');

        const companyId = localStorage.getItem('selectedCompanyId') || '1';

          vendor_id: parseInt(billData.vendorId),
          purchase_order_id: billData.purchaseOrderId ? parseInt(billData.purchaseOrderId) : null,
          bill_number: billData.billNumber || null,
          invoice_number: billData.invoiceNumber || null,
          amount: amount,
          bill_date: billData.billDate,
          due_date: billData.dueDate || null,
          is_inventory_bill: billData.isInventoryBill,

          payment_date: billData.paid ? billData.payment_date : null,
          company_id: parseInt(companyId)
        };
        console.log(`[UPDATE_BILL] Updating bill ${billId} with payload:`, payload);
        const data = await fetchWithRetry(`${BASE_URL}/bills/${billId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },

        console.log(`[UPDATE_BILL] Updated bill ${billId}:`, data);

        setEditingBillId(null);
        setEditingBillData(null);
        setSuccess('Bill updated successfully!');
        setTimeout(() => setSuccess(null), 3000);
        return data;
      } catch (err) {
        console.error(`[UPDATE_BILL] Error updating bill ${billId}:`, err);
        setError(`Failed to update bill: ${err.message.includes('SQLITE_ERROR') ? 'Database error - please contact support' : err.message}`);
        return null;
      }

    const payBill = async (bill) => {
      if (!window.confirm(`Mark this bill ${bill.bill_number || 'ID ' + bill.id} for ${getVendorName(bill.vendor_id)} as paid?`)) {
        return;
      }
      const checkNumber = prompt('Enter check number (optional):', '');
      if (checkNumber === null) return;
      const today = new Date().toISOString().split('T')[0];
      const updatedBillData = {
        vendorId: bill.vendor_id ? String(bill.vendor_id) : '',
        purchaseOrderId: bill.purchase_order_id ? String(bill.purchase_order_id) : '',
        expenseCategoryId: bill.expense_category_id ? String(bill.expense_category_id) : '',
        amount: bill.amount ? String(bill.amount) : '',
        billDate: bill.bill_date || today,
        dueDate: bill.due_date || '',
        paid: true,
        billNumber: bill.bill_number || '',
        invoiceNumber: bill.invoice_number || '',
        isInventoryBill: !!bill.is_inventory_bill,
        payment_date: today
      };
      console.log(`[PAY_BILL] Attempting to update bill ${bill.id} with data:`, updatedBillData);
      const updatedBill = await updateBill(bill.id, updatedBillData);
      if (updatedBill) {
        await fetchWithRetry(`${BASE_URL}/bills`, { headers: { 'Accept': 'application/json' } }, 'bills', setBills);
        generatePaidBillsPDF([updatedBill], checkNumber);
      }

    const deleteBill = async (id) => {
      try {
        await fetchWithRetry(`${BASE_URL}/bills/${id}`, { method: 'DELETE' }, 'delete_bill', null);
        setBills(prev => prev.filter(b => b.id !== id));
        setSelectedBills(prev => prev.filter(billId => billId !== id));
        setSuccess('Bill deleted successfully!');
        setTimeout(() => setSuccess(null), 3000);
      } catch (err) {
        setError(`Failed to delete bill: ${err.message}`);
      }
    };

    if (isLoading) {
