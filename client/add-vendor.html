  <script type="text/javascript">
    var gk_isXlsx = false;
    var gk_xlsxFileLookup = {};
    var gk_fileData = {};
    function filledCell(cell) {
      return cell !== '' && cell != null;
    }
    function loadFileData(filename) {
      if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
        try {
          var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
          var firstSheetName = workbook.SheetNames[0];
          var worksheet = workbook.Sheets[firstSheetName];
          var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
          var filteredData = jsonData.filter(row => row.some(filledCell));
          var headerRowIndex = filteredData.findIndex((row, index) =>
            row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
          );
          if (headerRowIndex === -1 || headerRowIndex > 25) {
            headerRowIndex = 0;
          }
          var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex));
          csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
          return csv;
        } catch (e) {
          console.error(e);
          return "";
        }
      }
      return gk_fileData[filename] || "";
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const BASE_URL = window.location.origin + '/api';

    const VendorsPage = () => {
      const [vendors, setVendors] = useState([]);
      const [searchQuery, setSearchQuery] = useState('');
      const [sortDirection, setSortDirection] = useState('asc');
      const [editingVendorId, setEditingVendorId] = useState(null);
      const [error, setError] = useState(null);
      const [success, setSuccess] = useState(null);
      const [newVendor, setNewVendor] = useState({
        name: '',
        email: '',
        phone: '',
        address: ''
      });
      const [isLoading, setIsLoading] = useState(true);

      const fetchWithRetry = async (url, options, type, setter, retries = 3, delay = 1000) => {
        console.log(`[FETCH] Starting ${type} from ${url}`);
        for (let i = 0; i < retries; i++) {
          try {
            console.log(`[FETCH] Attempt ${i + 1} for ${type}`);
            const response = await fetch(url, {
              ...options,
              signal: AbortSignal.timeout(15000)
            });
            console.log(`[FETCH] Response for ${type}: status ${response.status}, ok: ${response.ok}`);
            if (!response.ok) {
              const errorText = await response.text().catch(() => 'No response text');
              console.error(`[FETCH] HTTP error for ${type}: ${response.status} - ${errorText}`);
              throw new Error(`HTTP ${response.status}: ${errorText || 'Unknown server error'}`);
            }
            const contentType = response.headers.get('content-type');
            console.log(`[FETCH] Content-Type for ${type}: ${contentType}`);
            if (!contentType?.includes('application/json')) {
              const text = await response.text().catch(() => 'No response text');
              console.error(`[FETCH] Non-JSON response for ${type}: ${contentType || 'unknown'} - ${text.slice(0, 200)}`);
              throw new Error(`Expected JSON, got ${contentType || 'unknown'}: ${text.slice(0, 200)}`);
            }
            const data = await response.json();
            console.log(`[FETCH] Data for ${type}:`, data);
            if (!data) {
              console.error(`[FETCH] Empty response for ${type}`);
              throw new Error(`Received empty response for ${type}`);
            }
            if (setter) {
              console.log(`[FETCH] Setting state for ${type}`);
              setter(data);
            }
            return data;
          } catch (error) {
            console.error(`[FETCH] Error for ${type} (attempt ${i + 1}):`, error.message);
            if (i < retries - 1) {
              console.log(`[FETCH] Retrying ${type} after ${delay}ms`);
              await new Promise(resolve => setTimeout(resolve, delay));
              continue;
            }
            console.error(`[FETCH] All retries failed for ${type}:`, error.message);
            setError(`Failed to fetch ${type}: ${error.message}`);
            setIsLoading(false);
            throw error;
          }
        }
      };

      useEffect(() => {
        const fetchData = async () => {
          try {
            console.log('Starting fetch for vendors');
            await fetchWithRetry(`${BASE_URL}/vendors`, { headers: { 'Accept': 'application/json' } }, 'vendors', setVendors);
            console.log('Vendors fetch complete');
            setIsLoading(false);
          } catch (err) {
            console.error('Fetch error:', err.message);
            setError(`Failed to load vendors: ${err.message}`);
            setIsLoading(false);
          }
        };
        fetchData();
      }, []);

      const filteredVendors = vendors.filter(vendor =>
        vendor.name?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        vendor.email?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        vendor.address?.toLowerCase().includes(searchQuery.toLowerCase())
      );

      const sortedVendors = [...filteredVendors].sort((a, b) => {
        const isAsc = sortDirection === 'asc' ? 1 : -1;
        const aValue = (a.name || '').toLowerCase();
        const bValue = (b.name || '').toLowerCase();
        return aValue.localeCompare(bValue) * isAsc;
      });

      const handleSort = () => {
        setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
      };

      const addVendor = async () => {
        if (!newVendor.name || !newVendor.email) {
          setError('Name and email are required');
          return;
        }
        const vendorData = {
          name: newVendor.name,
          email: newVendor.email,
          phone: newVendor.phone || null,
          address: newVendor.address || null,
          company_id: parseInt(localStorage.getItem('selectedCompanyId') || '1')
        };
        console.log('[ADD VENDOR] Payload:', vendorData);
        try {
          const res = await fetch(`${BASE_URL}/vendors`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vendorData)
          });
          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errorText}`);
          }
          const data = await res.json();
          setVendors(prev => [...prev, data]);
          setNewVendor({ name: '', email: '', phone: '', address: '' });
          setSuccess('Vendor added successfully');
          setTimeout(() => setSuccess(null), 3000);
        } catch (err) {
          setError(`Error adding vendor: ${err.message}`);
        }
      };

      const deleteVendor = async (vendorId) => {
        console.log('[DELETE VENDOR] ID:', vendorId);
        try {
          const res = await fetch(`${BASE_URL}/vendors/${vendorId}`, {
            method: 'DELETE'
          });
          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errorText}`);
          }
          setVendors(prev => prev.filter(v => v.id !== vendorId));
          setSuccess('Vendor deleted successfully');
          setTimeout(() => setSuccess(null), 3000);
        } catch (err) {
          setError(`Error deleting vendor: ${err.message}`);
        }
      };

      const updateVendor = async (editingVendorId, formData) => {
        const vendor = {
          name: formData.get('name'),
          email: formData.get('email'),
          phone: formData.get('phone') || null,
          address: formData.get('address') || null,
          company_id: parseInt(localStorage.getItem('selectedCompanyId') || '1')
        };
        if (!vendor.name || !vendor.email) {
          setError('Name and email are required');
          return;
        }
        console.log('[UPDATE VENDOR] ID:', editingVendorId, 'Payload:', vendor);
        try {
          const res = await fetch(`${BASE_URL}/vendors/${editingVendorId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(vendor)
          });
          if (!res.ok) {
            const errorText = await res.text();
            throw new Error(`HTTP ${res.status}: ${errorText}`);
          }
          const updatedVendor = await res.json();
          setVendors(prev =>
            prev.map(v => (v.id === updatedVendor.id ? updatedVendor : v))
          );
          setEditingVendorId(null);
          setSuccess('Vendor updated successfully');
          setTimeout(() => setSuccess(null), 3000);
        } catch (err) {
          setError(`Error updating vendor: ${err.message}`);
        }
      };

      if (isLoading) {
        return (
          <main className="container mx-auto p-6 flex-grow">
            <h2 className="text-3xl font-bold mb-6">Manage Vendors</h2>
            <p>Loading vendors...</p>
          </main>
        );
      }

      return (
        <main className="container mx-auto p-6 flex-grow">
          <h2 className="text-3xl font-bold mb-6">Manage Vendors</h2>
          {error && (
            <div className="p-4 mb-6 text-red-600 bg-red-100 rounded-lg shadow-sm">
              Error: {error}
            </div>
          )}
          {success && (
            <div className="p-4 mb-6 text-green-600 bg-green-100 rounded-lg shadow-sm">
              {success}
            </div>
          )}
          <div className="form-container mb-6">
            <h3 className="text-lg font-semibold mb-2">Add Vendor</h3>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label htmlFor="add-name" className="block text-sm font-medium text-gray-700">Name</label>
                <input
                  id="add-name"
                  type="text"
                  value={newVendor.name}
                  onChange={e => setNewVendor({ ...newVendor, name: e.target.value })}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  required
                  placeholder="e.g., Vendor A"
                />
              </div>
              <div>
                <label htmlFor="add-email" className="block text-sm font-medium text-gray-700">Email</label>
                <input
                  id="add-email"
                  type="email"
                  value={newVendor.email}
                  onChange={e => setNewVendor({ ...newVendor, email: e.target.value })}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  required
                  placeholder="e.g., contact@vendor.com"
                />
              </div>
              <div>
                <label htmlFor="add-phone" className="block text-sm font-medium text-gray-700">Phone (Optional)</label>
                <input
                  id="add-phone"
                  type="text"
                  value={newVendor.phone}
                  onChange={e => setNewVendor({ ...newVendor, phone: e.target.value })}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  placeholder="e.g., 123-456-7890"
                />
              </div>
              <div>
                <label htmlFor="add-address" className="block text-sm font-medium text-gray-700">Address (Optional)</label>
                <input
                  id="add-address"
                  type="text"
                  value={newVendor.address}
                  onChange={e => setNewVendor({ ...newVendor, address: e.target.value })}
                  className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                  placeholder="e.g., 123 Main St, City, ST 12345"
                />
              </div>
            </div>
            <div className="mt-4">
              <button
                onClick={addVendor}
                className="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600"
              >
                Add Vendor
              </button>
            </div>
          </div>

          <div className="table-container mb-6">
            <div className="flex items-center gap-4 mb-4">
              <input
                type="text"
                placeholder="Search by Name, Email, or Address"
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
              />
            </div>
            {sortedVendors.length === 0 ? (
              <p className="p-4 bg-white rounded-lg shadow-md">No vendors in database</p>
            ) : (
              <table className="min-w-full divide-y divide-gray-200">
                <thead className="bg-gray-50">
                  <tr>
                    <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider cursor-pointer" onClick={handleSort}>
                      Name {sortDirection === 'asc' ? '↑' : '↓'}
                    </th>
                    <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                    <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Phone</th>
                    <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Address</th>
                    <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                  </tr>
                </thead>
                <tbody className="bg-white divide-y divide-gray-200">
                  {sortedVendors.map(vendor => (
                    <tr key={vendor.id} className="hover:bg-gray-100">
                      <td className="px-2 py-2">{vendor.name}</td>
                      <td className="px-2 py-2">{vendor.email}</td>
                      <td className="px-2 py-2">{vendor.phone || ''}</td>
                      <td className="px-2 py-2">{vendor.address || ''}</td>
                      <td className="px-2 py-2 whitespace-nowrap">
                        <button
                          className="bg-blue-500 text-white px-2 py-1 rounded mr-2 hover:bg-blue-600"
                          onClick={() => setEditingVendorId(vendor.id)}
                        >
                          Edit
                        </button>
                        <button
                          className="bg-red-500 text-white px-2 py-1 rounded hover:bg-red-600"
                          onClick={() => {
                            if (confirm('Are you sure you want to delete this vendor?')) {
                              deleteVendor(vendor.id);
                            }
                          }}
                        >
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            )}
          </div>

          {editingVendorId && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
              <div className="bg-white p-6 rounded-lg shadow-lg max-w-md w-full">
                <h3 className="text-lg font-semibold mb-4">Edit Vendor</h3>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    const formData = new FormData(e.target);
                    updateVendor(editingVendorId, formData);
                  }}
                >
                  <div className="mb-4">
                    <label htmlFor="name" className="block text-sm font-medium text-gray-700">Name</label>
                    <input
                      type="text"
                      id="name"
                      name="name"
                      defaultValue={vendors.find(v => v.id === editingVendorId)?.name || ''}
                      className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                      required
                    />
                  </div>
                  <div className="mb-4">
                    <label htmlFor="email" className="block text-sm font-medium text-gray-700">Email</label>
                    <input
                      type="email"
                      id="email"
                      name="email"
                      defaultValue={vendors.find(v => v.id === editingVendorId)?.email || ''}
                      className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                      required
                    />
                  </div>
                  <div className="mb-4">
                    <label htmlFor="phone" className="block text-sm font-medium text-gray-700">Phone</label>
                    <input
                      type="text"
                      id="phone"
                      name="phone"
                      defaultValue={vendors.find(v => v.id === editingVendorId)?.phone || ''}
                      className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    />
                  </div>
                  <div className="mb-4">
                    <label htmlFor="address" className="block text-sm font-medium text-gray-700">Address</label>
                    <input
                      type="text"
                      id="address"
                      name="address"
                      defaultValue={vendors.find(v => v.id === editingVendorId)?.address || ''}
                      className="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500"
                    />
                  </div>
                  <div className="flex justify-end space-x-2">
                    <button
                      type="button"
                      onClick={() => setEditingVendorId(null)}
                      className="bg-gray-600 text-white px-4 py-2 rounded-md hover:bg-gray-700"
                    >
                      Cancel
                    </button>
                    <button type="submit" className="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-600">
                      Save
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<VendorsPage />);
  </script>
  <script>

        } else {
          console.warn('No navigation links found');
        }
      };

      // Load colors from localStorage or use defaults
      const loadColors = () => {
        const savedHeaderColor = localStorage.getItem(headerKey) || defaultHeaderColor;
        const savedLinkColor = localStorage.getItem(linkKey) || defaultLinkColor;
        applyColors(savedHeaderColor, savedLinkColor);
        if (headerColorPicker) {
          headerColorPicker.value = savedHeaderColor;
        }
        if (linkColorPicker) {
          linkColorPicker.value = savedLinkColor;
        }
      };

      // Save colors to localStorage
      const saveColors = (headerColor, linkColor) => {
        if (headerColor) {
          localStorage.setItem(headerKey, headerColor);
          console.log(`Saved header color: ${headerColor} for key: ${headerKey}`);
        }
        if (linkColor) {
          localStorage.setItem(linkKey, linkColor);
          console.log(`Saved link color: ${linkColor} for key: ${linkKey}`);
        }
      };

      // Initialize colors
      loadColors();

      // Event listeners for color pickers
      if (headerColorPicker) {
        headerColorPicker.addEventListener('change', (e) => {
          const newColor = e.target.value;
          applyColors(newColor, localStorage.getItem(linkKey) || defaultLinkColor);
          saveColors(newColor, null);
        });
      } else {
        console.warn('Header color picker not found');
      }

      if (linkColorPicker) {
        linkColorPicker.addEventListener('change', (e) => {
          const newColor = e.target.value;
          applyColors(localStorage.getItem(headerKey) || defaultHeaderColor, newColor);
          saveColors(null, newColor);
        });
      } else {
        console.warn('Link color picker not found');
      }

      // Event listener for reset button
      if (resetButton) {
        resetButton.addEventListener('click', () => {
          localStorage.removeItem(headerKey);
          localStorage.removeItem(linkKey);
          applyColors(defaultHeaderColor, defaultLinkColor);
          saveColors(defaultHeaderColor, defaultLinkColor);
          if (headerColorPicker) {
            headerColorPicker.value = defaultHeaderColor;
          }
          if (linkColorPicker) {
            linkColorPicker.value = defaultLinkColor;
          }
          console.log('Reset colors to defaults');
        });
      } else {
        console.warn('Reset button not found');
      }
    });
  </script>
</body>
