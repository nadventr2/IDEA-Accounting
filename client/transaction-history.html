<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

  <script type="text/babel">
  const { useState, useEffect } = React;
  const BASE_URL = window.location.origin + '/api';

  const TransactionHistoryPage = () => {
    const [transactions, setTransactions] = useState([]);
    const [customers, setCustomers] = useState([]);
    const [products, setProducts] = useState([]);
    const [filters, setFilters] = useState({
      customer: '',
      sku: '',
      transactionNumber: '',
      startDate: '',
      endDate: '',
      paymentMethod: ''
    });
    const [selectedTransactionIndex, setSelectedTransactionIndex] = useState(-1);
    const [error, setError] = useState(null);
    const selectedCompanyId = localStorage.getItem('selectedCompanyId') || '1';

    const fetchWithRetry = async (url, options, type, setter, retries = 10, delay = 1000) => {
      console.log(`[FETCH] Starting ${type} from ${url}`);
      const urlWithCompany = `${url}?company_id=${selectedCompanyId}`;
      for (let i = 0; i < retries; i++) {
        try {
          console.log(`[FETCH] Attempt ${i + 1} for ${type}`);
          const res = await fetch(urlWithCompany, {
            ...options,
            headers: { 'Accept': 'application/json', ...options?.headers },
            signal: AbortSignal.timeout(15000)
          });
          console.log(`[FETCH] Response for ${type}: status ${res.status}`);
          if (!res.ok) {
            const errorText = await res.text().catch(() => 'No response text');
            throw new Error(`HTTP ${res.status}: ${errorText || 'Unknown server error'}`);
          }
          const contentType = res.headers.get('content-type');
          if (!contentType?.includes('application/json')) {
            const text = await res.text().catch(() => 'No response text');
            throw new Error(`Expected JSON, got ${contentType || 'unknown'}: ${text.slice(0, 200)}`);
          }
          const data = await res.json();
          console.log(`[FETCH] Data for ${type}:`, JSON.stringify(data, null, 2));
          if (!data) {
            throw new Error(`Received empty response for ${type}`);
          }
          setter(data);
          setError(null);
          return data;
        } catch (err) {
          console.error(`[FETCH] Error for ${type} (attempt ${i + 1}):`, err.message);
          if (i < retries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
            continue;
          }
          setError(`Failed to fetch ${type}: ${err.message || 'Unknown error'}`);
        }
      }
    };

    const fetchData = () => {
      fetchWithRetry(`${BASE_URL}/sales`, { headers: { 'Accept': 'application/json' } }, 'sales', setTransactions);
      fetchWithRetry(`${BASE_URL}/customers`, { headers: { 'Accept': 'application/json' } }, 'customers', setCustomers);
      fetchWithRetry(`${BASE_URL}/products`, { headers: { 'Accept': 'application/json' } }, 'products', setProducts);
    };

    useEffect(() => {
      fetchData();
      const interval = setInterval(fetchData, 10000); // Refresh every 10 seconds
      return () => clearInterval(interval);
    }, []);

    const getCustomer = (customerId) => {
      return customers.find(c => c.id === customerId) || {
        name: 'Unknown',
        email: 'N/A',
        shipping_address: 'N/A',
        billing_address: 'N/A'
      };
    };

    const getProduct = (productId) => {
      return products.find(p => p.id === productId) || {
        name: 'Unknown',
        sku: 'N/A',
        retail_price: 0
      };
    };

    const filteredTransactions = transactions
      .map(t => ({
        id: t.id,
        transactionNumber: t.transaction_number || 'N/A',
        customerId: t.customer_id,
        customerName: t.customer_name || getCustomer(t.customer_id).name,
        billingAddress: getCustomer(t.customer_id).billing_address,
        shippingAddress: getCustomer(t.customer_id).shipping_address,
        saleType: t.payment_method === 'Card' ? 'Credit' : 'Cash',
        paymentMethod: t.payment_method || 'N/A',
        date: t.date || 'N/A',
        subtotal: t.subtotal || 0,
        tax: t.tax || 0,
        taxRate: t.tax_rate || 0,
        taxLabel: t.tax_label || '',
        shipping: t.shipping || 0,
        discount: t.discount || 0,
        total: t.total || 0,
        items: (t.items || []).map(item => ({
          productId: item.product_id,
          productName: getProduct(item.product_id).name,
          sku: getProduct(item.product_id).sku,
          retailPrice: getProduct(item.product_id).retail_price,
          customPrice: item.custom_price,
          quantity: item.quantity || 0
        }))
      }))
      .filter(t => {
        const matchesCustomer = filters.customer
          ? t.customerName.toLowerCase().includes(filters.customer.toLowerCase())
          : true;
        const matchesSku = filters.sku
          ? t.items.some(item => item.sku.toLowerCase().includes(filters.sku.toLowerCase()))
          : true;
        const matchesTransactionNumber = filters.transactionNumber
          ? t.transactionNumber.toLowerCase().includes(filters.transactionNumber.toLowerCase())
          : true;
        const matchesStartDate = filters.startDate
          ? t.date >= filters.startDate
          : true;
        const matchesEndDate = filters.endDate
          ? t.date <= filters.endDate
          : true;
        const matchesPaymentMethod = filters.paymentMethod
          ? t.paymentMethod.toLowerCase().includes(filters.paymentMethod.toLowerCase())
          : true;
        return matchesCustomer && matchesSku && matchesTransactionNumber &&
               matchesStartDate && matchesEndDate && matchesPaymentMethod;
      })
      .sort((a, b) => {
        const aNum = a.transactionNumber || 'N/A';
        const bNum = b.transactionNumber || 'N/A';
        return aNum.localeCompare(bNum);
      });

    const handleFilterChange = (key, value) => {
      setFilters(prev => ({ ...prev, [key]: value }));
      setSelectedTransactionIndex(-1);
    };

    const handleNext = () => {
      setSelectedTransactionIndex(prev => Math.min(prev + 1, filteredTransactions.length - 1));
    };

    const handlePrevious = () => {
      setSelectedTransactionIndex(prev => Math.max(prev - 1, -1));
    };

    const handleTransactionClick = (index) => {
      setSelectedTransactionIndex(index);
    };

    return (
      <div className="pt-20 p-4 max-w-4xl mx-auto">
        {error && (
          <div className="p-4 mb-6 text-red-600 bg-red-100 rounded-lg shadow-sm">
            Error: {error}
          </div>
        )}
        <div className="mb-6 p-4 border rounded-lg bg-white shadow-sm">
          <h2 className="text-xl font-semibold mb-2">Transactions</h2>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
            <div>
              <label htmlFor="filter-customer" className="block text-sm font-medium text-gray-700">Customer</label>
              <input
                id="filter-customer"
                type="text"
                placeholder="Search by Customer..."
                value={filters.customer}
                onChange={e => handleFilterChange('customer', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
            <div>
              <label htmlFor="filter-sku" className="block text-sm font-medium text-gray-700">SKU</label>
              <input
                id="filter-sku"
                type="text"
                placeholder="Search by SKU..."
                value={filters.sku}
                onChange={e => handleFilterChange('sku', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
            <div>
              <label htmlFor="filter-transactionNumber" className="block text-sm font-medium text-gray-700">Transaction Number</label>
              <input
                id="filter-transactionNumber"
                type="text"
                placeholder="Search by Transaction Number..."
                value={filters.transactionNumber}
                onChange={e => handleFilterChange('transactionNumber', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
            <div>
              <label htmlFor="filter-paymentMethod" className="block text-sm font-medium text-gray-700">Payment Method</label>
              <input
                id="filter-paymentMethod"
                type="text"
                placeholder="Search by Payment Method..."
                value={filters.paymentMethod}
                onChange={e => handleFilterChange('paymentMethod', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
            <div>
              <label htmlFor="filter-startDate" className="block text-sm font-medium text-gray-700">Start Date</label>
              <input
                id="filter-startDate"
                type="date"
                value={filters.startDate}
                onChange={e => handleFilterChange('startDate', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
            <div>
              <label htmlFor="filter-endDate" className="block text-sm font-medium text-gray-700">End Date</label>
              <input
                id="filter-endDate"
                type="date"
                value={filters.endDate}
                onChange={e => handleFilterChange('endDate', e.target.value)}
                className="border p-2 w-full rounded-lg"
              />
            </div>
          </div>
          <div className="table-container">
            <table className="min-w-full divide-y divide-gray-200">
              <thead className="bg-gray-50">
                <tr>
                  <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Transaction Number</th>
                  <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date</th>
                  <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Customer</th>
                  <th className="px-2 py-2 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Total</th>
                </tr>
              </thead>
              <tbody className="bg-white divide-y divide-gray-200">
                {filteredTransactions.length > 0 ? (
                  filteredTransactions.map((t, index) => (
                    <React.Fragment key={t.id}>
                      <tr
                        onClick={() => handleTransactionClick(index)}
                        className={`cursor-pointer ${index === selectedTransactionIndex ? 'bg-blue-100' : ''}`}
                      >
                        <td className="px-2 py-2 whitespace-nowrap">{t.transactionNumber}</td>
                        <td className="px-2 py-2 whitespace-nowrap">{t.date}</td>
                        <td className="px-2 py-2 whitespace-nowrap">{t.customerName}</td>
                        <td className="px-2 py-2 whitespace-nowrap">${t.total.toFixed(2)}</td>
                      </tr>
                      {index === selectedTransactionIndex && (
                        <tr>
                          <td colSpan="4" className="px-2 py-2">
                            <div className="p-4 border rounded-lg bg-gray-50">
                              <div className="flex justify-between items-center mb-2">
                                <h3 className="text-lg font-semibold">Transaction Details</h3>
                                <div className="space-x-2">
                                  <button
                                    onClick={handlePrevious}
                                    disabled={selectedTransactionIndex <= -1}
                                    className="bg-gray-500 text-white p-2 rounded disabled:bg-gray-300"
                                  >
                                    ←
                                  </button>
                                  <button
                                    onClick={handleNext}
                                    disabled={selectedTransactionIndex >= filteredTransactions.length - 1}
                                    className="bg-gray-500 text-white p-2 rounded disabled:bg-gray-300"
                                  >
                                    →
                                  </button>
                                </div>
                              </div>
                              <p><strong>Transaction Number:</strong> {t.transactionNumber}</p>
                              <p><strong>Date:</strong> {t.date}</p>
                              <p><strong>Items:</strong></p>
                              <ul className="list-disc pl-5">
                                {t.items.length > 0 ? (
                                  t.items.map(item => (
                                    <li key={item.productId}>
                                      {item.productName} (SKU: {item.sku}, Quantity: {item.quantity}, Price: ${(item.customPrice || item.retailPrice).toFixed(2)})
                                    </li>
                                  ))
                                ) : (
                                  <li>No items</li>
                                )}
                              </ul>
                              <p><strong>Subtotal:</strong> ${t.subtotal.toFixed(2)}</p>
                              <p><strong>{(window.CompanyConfig && CompanyConfig.taxCaption) ? CompanyConfig.taxCaption({ tax_rate: t.taxRate, tax_label: t.taxLabel }) : ('Tax (' + ((Number(t.taxRate) > 1 && Number(t.taxRate) <= 100 ? Number(t.taxRate) : (Number(t.taxRate) || 0) * 100)).toFixed(2) + '%)')}:</strong> ${t.tax.toFixed(2)}</p>
                              <p><strong>Shipping:</strong> ${t.shipping.toFixed(2)}</p>
                              {t.discount > 0 && <p><strong>Discount:</strong> -${t.discount.toFixed(2)}</p>}
                              <p><strong>Total:</strong> ${t.total.toFixed(2)}</p>
                              <p><strong>Payment Method:</strong> {t.paymentMethod}</p>
                              <p><strong>Customer:</strong> {t.customerName}</p>
                              <p><strong>Sale Type:</strong> {t.saleType}</p>
                              <p><strong>Billing Address:</strong> {t.billingAddress}</p>
                              <p><strong>Shipping Address:</strong> {t.shippingAddress}</p>
                            </div>
                          </td>
                        </tr>
                      )}
                    </React.Fragment>
                  ))
                ) : (
                  <tr>
                    <td colSpan="4" className="px-2 py-2 text-center">No transactions found</td>
                  </tr>
                )}
              </tbody>
            </table>
          </div>
        </div>
        <div className="flex">
          <a href="/" className="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">Back to Main Page</a>
        </div>
      </div>
    );
  };

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<TransactionHistoryPage />);
</script>
