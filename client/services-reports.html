<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

  <script type="text/javascript">
    const BASE_URL = window.location.origin + '/api';

    const fetchWithRetry = async (url, options, type, retries = 5, delay = 1000) => {
      const companyId = '2';
      const urlWithCompany = `${url}?company_id=${companyId}`;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(urlWithCompany, {
            ...options,
            headers: { 'Accept': 'application/json', 'Content-Type': 'application/json', ...options?.headers },
            signal: AbortSignal.timeout(10000)
          });
          if (!response.ok) {
            const errorText = await response.text().catch(() => 'No response text');
            throw new Error(`HTTP ${response.status}: ${errorText || 'Unknown error'}`);
          }
          const data = await response.json();
          if (!data) throw new Error(`Empty response for ${type}`);
          return data;
        } catch (error) {
          if (i < retries - 1) {
            await new Promise(resolve => setTimeout(resolve, delay));
            continue;
          }
          throw error;
        }
      }
    };
  </script>
  <script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const ReportsPage = () => {
      const [deposits, setDeposits] = useState([]);
      const [expenses, setExpenses] = useState([]);
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      const [error, setError] = useState(null);
      const [message, setMessage] = useState({ text: '', type: '' });
      const [isLoading, setIsLoading] = useState(true);
      const lineChartRef = useRef(null);
      const barChartRef = useRef(null);

      useEffect(() => {
        const fetchData = async () => {
          setIsLoading(true);
          try {
            const [depData, expData] = await Promise.all([
              fetchWithRetry(`${BASE_URL}/deposits`, { headers: { 'Accept': 'application/json' } }, 'deposits'),
              fetchWithRetry(`${BASE_URL}/expenses`, { headers: { 'Accept': 'application/json' } }, 'expenses')
            ]);
            setDeposits(Array.isArray(depData) ? depData : [depData]);
            setExpenses(Array.isArray(expData) ? expData : [expData]);
            setIsLoading(false);
          } catch (err) {
            setError(`Failed to load data: ${err.message}`);
            setIsLoading(false);
          }
        };
        fetchData();
      }, []);

      useEffect(() => {
        if (!isLoading && deposits.length > 0 && expenses.length > 0) {
          const monthlyData = calculateMonthlyData(deposits, expenses, startDate, endDate);
          renderCharts(monthlyData);
        }
      }, [deposits, expenses, startDate, endDate, isLoading]);

      const calculateMonthlyData = (deposits, expenses, start, end) => {
        const startDate = start ? new Date(start) : new Date(Math.min(...deposits.concat(expenses).map(d => new Date(d.date))));
        const endDate = end ? new Date(end) : new Date();
        const months = [];
        let current = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        while (current <= endDate) {
          months.push({
            label: `${current.getFullYear()}-${(current.getMonth() + 1).toString().padStart(2, '0')}`,
            income: 0,
            expense: 0
          });
          current.setMonth(current.getMonth() + 1);
        }
        deposits.forEach(dep => {
          const date = new Date(dep.date);
          if ((!start || date >= startDate) && (!end || date <= endDate)) {
            const monthKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
            const month = months.find(m => m.label === monthKey);
            if (month) month.income += dep.amount;
          }
        });
        expenses.forEach(exp => {
          const date = new Date(exp.date);
          if ((!start || date >= startDate) && (!end || date <= endDate)) {
            const monthKey = `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}`;
            const month = months.find(m => m.label === monthKey);
            if (month) month.expense += exp.amount;
          }
        });
        return months;
      };

      const renderCharts = (monthlyData) => {
        if (lineChartRef.current) {
          lineChartRef.current.destroy();
        }
        if (barChartRef.current) {
          barChartRef.current.destroy();
        }
        const lineCtx = document.getElementById('lineChart').getContext('2d');
        lineChartRef.current = new Chart(lineCtx, {
          type: 'line',
          data: {
            labels: monthlyData.map(m => m.label),
            datasets: [
              {
                label: 'Income',
                data: monthlyData.map(m => m.income),
                borderColor: '#2563eb',
                fill: false
              },
              {
                label: 'Expenses',
                data: monthlyData.map(m => m.expense),
                borderColor: '#dc2626',
                fill: false
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              x: { type: 'time', time: { unit: 'month' } },
              y: { beginAtZero: true, title: { display: true, text: 'Amount ($)' } }
            }
          }
        });
        const barCtx = document.getElementById('barChart').getContext('2d');
        barChartRef.current = new Chart(barCtx, {
          type: 'bar',
          data: {
            labels: monthlyData.map(m => m.label),
            datasets: [
              {
                label: 'Income',
                data: monthlyData.map(m => m.income),
                backgroundColor: '#2563eb'
              },
              {
                label: 'Expenses',
                data: monthlyData.map(m => m.expense),
                backgroundColor: '#dc2626'
              }
            ]
          },
          options: {
            responsive: true,
            scales: {
              x: { stacked: true },
              y: { stacked: true, beginAtZero: true, title: { display: true, text: 'Amount ($)' } }
            }
          }
        });
      };

      const generatePDF = useCallback(() => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.setFontSize(14);
        doc.setFont('helvetica', 'bold');
        const _co = (window.CompanyConfig && CompanyConfig.get) ? (CompanyConfig.get() || {}) : {};
      const companyText = _co.legal_name || _co.name || 'My Company';
        const companyWidth = doc.getTextWidth(companyText);
        doc.text(companyText, (doc.internal.pageSize.width - companyWidth) / 2, 15);
        doc.setFontSize(10);
        doc.setFont('helvetica', 'normal');
        const addressText = (_co && _co.settings && _co.settings.address) || '';
        const addressWidth = doc.getTextWidth(addressText);
        doc.text(addressText, (doc.internal.pageSize.width - addressWidth) / 2, 22);
        const phoneText = (_co && _co.settings && _co.settings.phone) ? ('Phone: ' + _co.settings.phone) : '';
        const phoneWidth = doc.getTextWidth(phoneText);
        doc.text(phoneText, (doc.internal.pageSize.width - phoneWidth) / 2, 29);
        doc.setFontSize(12);
        doc.text('Profit & Loss Report', 20, 46);
        if (startDate && endDate) {
          doc.text(`Period: ${startDate} to ${endDate}`, 20, 54);
        }
        const filteredDeposits = deposits.filter(d => (!startDate || d.date >= startDate) && (!endDate || d.date <= endDate));
        const filteredExpenses = expenses.filter(e => (!startDate || e.date >= startDate) && (!endDate || e.date <= endDate));
        const totalIncome = filteredDeposits.reduce((sum, d) => sum + d.amount, 0);
        const totalExpenses = filteredExpenses.reduce((sum, e) => sum + e.amount, 0);
        const profit = totalIncome - totalExpenses;
        doc.autoTable({

      }, [deposits, expenses, startDate, endDate]);

      const handleFilter = useCallback((e) => {
        e.preventDefault();

        );
      }

      return (
        <main className="container mx-auto p-6 flex-grow">
          <h2 className="text-3xl font-bold mb-6">Reports</h2>
          {error && (
            <div className="p-4 mb-6 text-red-600 bg-red-100 rounded-lg shadow-sm">

          {message.text && (
            <div className={`p-4 mb-6 ${message.type === 'success' ? 'text-green-600 bg-green-100' : 'text-red-600 bg-red-100'} rounded-lg shadow-sm`}>
              {message.text}
            </div>
          )}
          <div className="form-container mb-6">
            <h3 className="text-lg font-semibold mb-2">Filter Reports</h3>
            <form onSubmit={handleFilter}>
              <label htmlFor="startDate" className="block text-sm font-medium text-gray-700">Start Date</label>
              <input
                type="date"
                id="startDate"
                value={startDate}
                onChange={(e) => setStartDate(e.target.value)}

              <label htmlFor="endDate" className="block text-sm font-medium text-gray-700 mt-4">End Date</label>
              <input

              <div className="mt-4 flex gap-4">
                <button type="submit" className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                  Apply Filter
                </button>
                <button
                  type="button"
                  onClick={generatePDF}
                  className="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700"
                >
                  Export P&L as PDF
                </button>
              </div>
            </form>
          </div>
          <div className="form-container mb-6">
            <h3 className="text-lg font-semibold mb-2">Profit & Loss</h3>
            <table className="min-w-full divide-y divide-gray-200">
              <thead className="bg-blue-600 text-white">
                <tr>
                  <th className="px-2 py-2 text-left text-xs font-medium uppercase tracking-wider">Description</th>
                  <th className="px-2 py-2 text-left text-xs font-medium uppercase tracking-wider">Amount</th>

              </thead>
              <tbody className="bg-white divide-y divide-gray-200">
                <tr>
                  <td className="px-2 py-2 whitespace-nowrap">Total Income</td>
                  <td className="px-2 py-2 whitespace-nowrap">
                    ${deposits.filter(d => (!startDate || d.date >= startDate) && (!endDate || d.date <= endDate))
                      .reduce((sum, d) => sum + d.amount, 0).toFixed(2)}
                  </td>
                </tr>
                <tr>
                  <td className="px-2 py-2 whitespace-nowrap">Total Expenses</td>
                  <td className="px-2 py-2 whitespace-nowrap">
                    ${expenses.filter(e => (!startDate || e.date >= startDate) && (!endDate || e.date <= endDate))
                      .reduce((sum, e) => sum + e.amount, 0).toFixed(2)}
                  </td>

                <tr>
                  <td className="px-2 py-2 whitespace-nowrap">Net Profit</td>
                  <td className="px-2 py-2 whitespace-nowrap">
                    ${(deposits.filter(d => (!startDate || d.date >= startDate) && (!endDate || d.date <= endDate))
                      .reduce((sum, d) => sum + d.amount, 0) -
                      expenses.filter(e => (!startDate || e.date >= startDate) && (!endDate || e.date <= endDate))
                      .reduce((sum, e) => sum + e.amount, 0)).toFixed(2)}
                  </td>
                </tr>
              </tbody>

          <div className="form-container mb-6">

            <canvas id="lineChart"></canvas>

            <h3 className="text-lg font-semibold mb-2">Income vs. Expenses (Bar Chart)</h3>
            <canvas id="barChart"></canvas>
          </div>
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ReportsPage />);

      linkColorPicker.addEventListener('change', (e) => {

      });
    });
