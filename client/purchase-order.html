    window.addEventListener('error', (e) => { console.error('%cGLOBAL JAVASCRIPT ERROR →', 'color:red;font-size:20px', e.error); });

        c => c.id === parseInt(newPO.dropShipCustomerId)

      if (selectedCustomer?.shipping_address) {
        // Only auto-fill if user hasn't typed anything custom yet
        if (!newPO.shippingAddress || newPO.shippingAddress.trim() === '') {
          setNewPO(prev => ({
            ...prev,
            shippingAddress: selectedCustomer.shipping_address
          }));
        }
      }
    } else {
      // Clear if no customer selected
      setNewPO(prev => ({ ...prev, shippingAddress: '' }));
    }
  }, [newPO.dropShipCustomerId, customers]);

      // Item adding

        const d = new Date();
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const yy = String(d.getFullYear()).slice(-2);
        return { mmddyy: `${mm}${dd}${yy}`, yyyyMMdd: `${d.getFullYear()}-${mm}-${dd}` };
      };
const getNextPoNumber = () => {
  const { mmddyy } = getTodayDate();
  const todayPOs = (purchaseOrders || []).filter(po => 
    po && po.po_number && typeof po.po_number === 'string' && po.po_number.startsWith(mmddyy)
  );
  return `${mmddyy}-${todayPOs.length + 1}`;
};
      const calculateTotal = items => {
  if (!Array.isArray(items)) return '0.00';  // safe fallback if undefined/null/not array
  return items.reduce((s, i) => s + i.quantity * parseFloat(i.unit_price || 0), 0).toFixed(2);
};
const fetchData = useCallback(async () => {
  setIsLoading(true);
  setError(null);  // Clear previous errors
  try {
    const companyId = localStorage.getItem('selectedCompanyId') || '1';
    const [poRes, vendorRes, customerRes, productRes, salesRes] = await Promise.all([
      fetch(`${BASE_URL}/api/purchase-order?company_id=${companyId}`),
      fetch(`${BASE_URL}/api/vendors?company_id=${companyId}`),
      fetch(`${BASE_URL}/api/customers?company_id=${companyId}`),
      fetch(`${BASE_URL}/api/products?company_id=${companyId}`),
      fetch(`${BASE_URL}/api/sales?company_id=${companyId}`)
    ]);

    // SAFE PARSING FOR ALL - ADD THESE LINES:
    const poData = await poRes.json();
    const vendorData = await vendorRes.json();
    const customerData = await customerRes.json();
    const productData = await productRes.json();
    const salesData = await salesRes.json();

    setPurchaseOrders(Array.isArray(poData) ? poData : []);
    setVendors(Array.isArray(vendorData) ? vendorData : []);     // ✅ FIX
    setCustomers(Array.isArray(customerData) ? customerData : []); // ✅ FIX
    setProducts(Array.isArray(productData) ? productData : []);   // ✅ FIX
    setSales(Array.isArray(salesData) ? salesData : []);         // ✅ FIX

  } catch (err) {
    console.error('fetchData error:', err);  // Better logging
    setError(`Failed to load data: ${err.message}`);
    // Set empty arrays as fallback
    setPurchaseOrders([]);
    setVendors([]);
    setCustomers([]);
    setProducts([]);
    setSales([]);
  }
  setIsLoading(false);
}, [fetchData]);  // Note: this should be [BASE_URL, companyId] but keeping your original
      useEffect(() => { fetchData(); }, [fetchData]);
useEffect(() => {
  const { yyyyMMdd } = getTodayDate();
  setNewPO(prev => ({
    ...prev,
    poNumber: getNextPoNumber(),
    dateOrdered: yyyyMMdd,
    expectedDelivery: yyyyMMdd  // ← add this line
  }));
}, [purchaseOrders]);
      const getVendorName = id => vendors.find(v => v.id === parseInt(id))?.name || 'Unknown';
      const getCustomerName = id => customers.find(c => c.id === parseInt(id))?.name || 'N/A';
      const handleSort = (key) => {
        if (sortKey === key) {
          setSortDirection(sortDirection === 'asc' ? 'desc' : 'asc');
        } else {
          setSortKey(key);
          setSortDirection('desc');
        }
      };
 const sortedAndFilteredPOs = [...(Array.isArray(purchaseOrders) ? purchaseOrders : [])]
  .filter(po => po && typeof po === 'object') // skip truly undefined/null entries
  .sort((a, b) => {
    // Safe access with fallback empty string
    const aVal = sortKey === 'date_ordered' 
      ? (a.date_ordered || '') 
      : (a.po_number || '');
    const bVal = sortKey === 'date_ordered' 
      ? (b.date_ordered || '') 
      : (b.po_number || '');
    const result = aVal > bVal ? 1 : aVal < bVal ? -1 : 0;
    return sortDirection === 'asc' ? result : -result;
  })
  .filter(po => {
    if (!po) return false; // safety
    const q = searchQuery.toLowerCase();
    // Safe string checks
    const poNum = (po.po_number || '').toString().toLowerCase();
    const vendorName = getVendorName(po.vendor_id || '').toLowerCase();
    const customerName = getCustomerName(po.drop_ship_customer_id || '').toLowerCase();
    const status = (po.status || '').toLowerCase();

    return poNum.includes(q) ||
           vendorName.includes(q) ||
           customerName.includes(q) ||
           status.includes(q);
  });
      const addItem = () => {
        if (!newItem.productId || !newItem.quantity || !newItem.unitPrice) {
          setError('Please select a product and enter both quantity & price');
          setTimeout(() => setError(null), 4000);
          return;
        }
        setNewPO(prev => ({
          ...prev,
          items: [...prev.items, {
            product_id: parseInt(newItem.productId),
            quantity: parseInt(newItem.quantity),
            unit_price: parseFloat(newItem.unitPrice).toFixed(2),
            tempId: Date.now()
          }]
        }));
        setNewItem({ productId: '', productName: '', quantity: '', unitPrice: '' });
        setShowProductDropdown(false);
      };
const createPurchaseOrder = () => {
  if (!newPO.vendorId || newPO.items.length === 0) {
    setError('Vendor and at least one item required');
    return;
  }

  let finalPoNumber = (newPO.poNumber || '').trim();
  if (finalPoNumber) {
    let counter = 1;
    while (purchaseOrders.some(po => po && po.po_number === finalPoNumber)) {
      finalPoNumber = `${newPO.poNumber.trim()}-${counter}`;
      counter++;
    }
  }

  fetch(`${BASE_URL}/api/purchase-order`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      po_number: finalPoNumber || null,
      vendor_id: newPO.vendorId,
      drop_ship_customer_id: newPO.dropShipCustomerId || null,
      date_ordered: newPO.dateOrdered,
      expected_delivery: newPO.expectedDelivery || null,
      status: newPO.status,
      notes: newPO.notes || null,
      items: newPO.items.map(i => ({
        product_id: i.product_id,
        quantity: i.quantity,
        unit_price: i.unit_price
      })),
      shipping_address: newPO.shippingAddress || null,
      company_id: parseInt(localStorage.getItem('selectedCompanyId') || '1')
    })
  })
    .then(res => {
      if (!res.ok) {
        return res.text().then(errText => {
          throw new Error(`Server error ${res.status}: ${errText}`);
        });
      }
      return res.json();
    })
    .then(data => {
      console.log('PO created successfully:', data);
      setPurchaseOrders(prev => [...prev, data]);
      setNewPO(prev => ({
        ...prev,
        vendorId: '',
        dropShipCustomerId: '',
        items: [],
        notes: '',
        poNumber: getNextPoNumber(),
        shippingAddress: ''
      }));
      setSuccess('Purchase Order created!');
      setTimeout(() => setSuccess(null), 4000);
    })
    .catch(err => {
      console.error('Create PO failed:', err);
      setError('Create failed: ' + (err.message || 'Unknown error'));
    });
};

const saveEdit = () => {
  fetch(`${BASE_URL}/api/purchase-order/${editingPO.id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      po_number: editingPO.po_number,
      vendor_id: editingPO.vendor_id,
      drop_ship_customer_id: editingPO.drop_ship_customer_id || null,
      date_ordered: editingPO.date_ordered,
      expected_delivery: editingPO.expected_delivery,
      status: editingPO.status,
      notes: editingPO.notes,
      items: editingPO.items.map(i => ({
        product_id: i.product_id,
        quantity: i.quantity,
        unit_price: i.unit_price
      }))
    })
  })
    .then(res => {
      if (!res.ok) {
        return res.text().then(errText => {
          throw new Error(`Server error ${res.status}: ${errText}`);
        });
      }
      return res.json();
    })
    .then(data => {
      console.log('PO updated successfully:', data);
      setPurchaseOrders(prev => prev.map(p => p.id === data.id ? data : p));
      setEditingPO(null);
      setSuccess('PO updated!');
      setTimeout(() => setSuccess(null), 4000);
    })
    .catch(err => {
      console.error('Update PO failed:', err);
      setError('Update failed: ' + (err.message || 'Unknown error'));
    });
};

  setEditingPO({ ...po, items: po.items.map(i => ({ ...i })) });
  const customer = customers.find(c => c.id === po.drop_ship_customer_id);
  setEditCustomerSearch(customer ? customer.name : ''); // Pre-fill search
  setExpandedPO(po.id);
};

      if (isLoading) return <main className="p-6 text-center text-2xl">Loading...</main>;

      ];
      const buildSpreadsheetRows = () => {
        const customerObj = po.drop_ship_customer_id
          ? customers.find(c => c.id === parseInt(po.drop_ship_customer_id, 10))
          : null;
        // Prefer PO override address, then customer default (single-line for spreadsheet paste)
        const customerName = (customerObj?.name || '').trim();
        const shippingAddress = String(
          po.shipping_address || customerObj?.shipping_address || ''
        )
          .replace(/\r\n/g, '\n')
          .replace(/\n+/g, ', ')
          .replace(/\s+/g, ' ')
          .trim()
          .slice(0, 255);
        const salesArray = Array.isArray(sales) ? sales : [];
        const latestSale = po.drop_ship_customer_id
          ? salesArray
            .filter(s => s.customer_id === parseInt(po.drop_ship_customer_id, 10))
            .sort((a, b) => new Date(b.date) - new Date(a.date))[0]
          : null;
        const paymentMethod = latestSale?.payment_method || 'Check';
        return items.map(item => {
          const product = products.find(p => p.id === item.product_id) || { sku: '' };
          const qty = Number(item.quantity) || 0;
          const unit = parseFloat(item.unit_price || 0);
          const totalCost = (qty * unit).toFixed(2);
          return [
            '',
            po.date_ordered || '',
            paymentMethod,
            `*${po.po_number || ''}*`,
            product.sku || '',
            String(qty),
            unit.toFixed(2),
            totalCost,
            customerName,
            shippingAddress
          ];
        });
      };
      const generateSpreadsheetLine = () =>
        buildSpreadsheetRows().map(cols => cols.join('\t')).join('\n');
      const copyToClipboard = () => {
        navigator.clipboard.writeText(generateSpreadsheetLine()).then(() => {
          alert('Spreadsheet line(s) copied! Paste into Google Sheets and make the PO# column red.');
        });
      };
      const sheetRows = buildSpreadsheetRows();
      return (
        <div className="p-8 bg-white">
          <h4 className="text-2xl font-bold mb-6">Purchase Order #{po.po_number}</h4>
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm mb-6">
            <div><strong>Vendor:</strong> {vendor.name}</div>
            {vendor.address && <div><strong>Vendor Address:</strong> {vendor.address}</div>}
            {customer && <div><strong>Drop Ship To:</strong> {customer.name}</div>}
            {(po.shipping_address || customer?.shipping_address) && (
              <div>
                <strong>Shipping Address:</strong>{' '}
                {po.shipping_address || customer?.shipping_address}
              </div>
            )}
            <div><strong>Date Ordered:</strong> {po.date_ordered}</div>
            <div><strong>Expected Delivery:</strong> {po.expected_delivery || 'N/A'}</div>
            <div><strong>Status:</strong> {po.status}</div>
            <div><strong>Total:</strong> <span className="text-xl font-bold">${total}</span></div>
          </div>
          {notes && <div className="mb-6 p-4 bg-gray-50 rounded-lg"><strong>Notes:</strong> {notes}</div>}
          <table className="item-table w-full mb-8">
            <thead>
              <tr>
                <th>SKU</th><th>Product</th><th>Qty</th><th>Unit Price</th><th>Line Total</th>
              </tr>
            </thead>
            <tbody>
              {items.map((i, idx) => {
                const p = products.find(x => x.id === i.product_id) || { sku: '', name: 'Unknown' };
                const qty = Number(i.quantity) || 0;
                const unit = parseFloat(i.unit_price || 0);
                return (
                  <tr key={idx}>
                    <td>{p.sku}</td>
                    <td>{p.name}</td>
                    <td>{qty}</td>
                    <td>${unit.toFixed(2)}</td>
                    <td>${(qty * unit).toFixed(2)}</td>
                  </tr>
                );
              })}
            </tbody>
            <tfoot>
              <tr>
                <td colSpan="4" className="text-right font-bold text-lg">Grand Total:</td>
                <td className="font-bold text-lg">${total}</td>
              </tr>
            </tfoot>
          </table>
          <div className="flex flex-wrap gap-4">
            <button onClick={generatePDF} className="bg-gray-600 hover:bg-gray-700 text-white px-6 py-3 rounded font-medium">
              Print / Save as PDF
            </button>
            <button onClick={copyToClipboard} className="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded font-medium">
              Copy Spreadsheet Line
            </button>
          </div>
          <div className="mt-6 text-sm bg-gray-50 p-4 rounded overflow-x-auto">
            <strong>Spreadsheet paste preview</strong>
            <span className="text-gray-500 text-xs ml-2">(copy uses tab-separated columns for Sheets)</span>
            <table className="item-table w-full mt-3 text-xs" style={{ minWidth: '720px' }}>
              <thead>
                <tr>
                  {spreadsheetHeaders.map((h, i) => (
                    <th key={i} className="whitespace-nowrap bg-gray-200">{h || '·'}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {sheetRows.map((cols, ri) => (
                  <tr key={ri}>
                    {cols.map((cell, ci) => (
                      <td key={ci} className="whitespace-nowrap align-top" style={{ maxWidth: ci === 9 ? '220px' : undefined, whiteSpace: ci === 9 ? 'normal' : 'nowrap' }}>
                        {ci === 6 || ci === 7 ? `$${cell}` : cell}
                      </td>
                    ))}
                  </tr>
                ))}
              </tbody>
            </table>
            {sheetRows.some(r => parseFloat(r[6]) === 0) && (
              <p className="mt-2 text-amber-700 text-xs">
                Note: one or more lines show Unit Price $0.00 — that is the stored cost on the PO line, not a size/unit field.
              </p>
            )}
          </div>
        </div>
      );
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<PurchaseOrderPage />);
  </script>
  <script>

      linkColorPicker.addEventListener('input', e => {
        const c = e.target.value;
        navLinks.forEach(l => l.style.color = c);
        localStorage.setItem(linkKey, c);
      });
      localStorage.setItem('selectedCompanyId', '1');
    });
  </script>
</body>

</html>
